[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | \.eggs
  | \.ipynb_checkpoints
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["mem0_config"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".ipynb_checkpoints",
]

[tool.bandit]
exclude_dirs = [
    ".git",
    ".venv",
    "venv",
    "tests",
]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-agent-framework-workshop"
version = "1.0.0"
description = "Comprehensive hands-on workshop for building AI agents using Microsoft's Agent Framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    {name = "Microsoft Agent Framework Workshop Contributors"},
]
keywords = ["azure", "ai", "agents", "workshop", "tutorial", "openai", "microsoft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "agent-framework-azure-ai>=0.1.0",
    "azure-ai-projects>=1.0.0",
    "azure-identity>=1.15.0",
    "azure-monitor-query>=1.3.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-mgmt-loganalytics>=13.0.0",
    "openai>=1.0.0",
    "mem0ai>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "agent-framework-devui>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pylint>=3.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.5",
    "pre-commit>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/gokoner/microsoft-agent-framework-workshop"
Documentation = "https://github.com/gokoner/microsoft-agent-framework-workshop/blob/main/README.md"
Repository = "https://github.com/gokoner/microsoft-agent-framework-workshop"
Issues = "https://github.com/gokoner/microsoft-agent-framework-workshop/issues"
